[project]
name = "bl-loops-parallel-agents"
version = "0.1.0"
description = "Fan-out/fan-in didactico local: tres fuentes en paralelo frente a la misma extraccion secuencial."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
parallel-agents-demo = "parallel_agents.demo:main"
parallel-agents-validate = "parallel_agents.validation:main"
parallel-agents-export-schemas = "parallel_agents.schema_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/parallel_agents"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
