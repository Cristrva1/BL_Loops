[project]
name = "bl-loops-hyperframes-video-studio"
version = "0.1.0"
description = "Laboratorio didáctico para HyperFrames y generación de video con IA Local (Ollama)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
hyperframes-studio-demo = "hyperframes_studio.main:run_demo_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperframes_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --basetemp=.local/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"
