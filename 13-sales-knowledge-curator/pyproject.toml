[project]
name = "bl-loops-sales-knowledge-curator"
version = "0.2.0"
description = "Curador local de conocimiento de ventas: afirmaciones trazables, conflictos y releases."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai==0.9.2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "markitdown[docx,pdf]==0.1.7",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
sales-curator = "sales_curator.cli:main"
sales-curator-export-schemas = "sales_curator.schema_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/sales_curator"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.local/pytest"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
