[project]
name = "bl-loops-local-code-hermes"
version = "0.1.0"
description = "Preflight didactico y benchmark local para Hermes con Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
hermes-preflight = "local_code_hermes.preflight:main"
hermes-fixture-verify = "local_code_hermes.fixture:main"
hermes-run-validate = "local_code_hermes.validation:main"
hermes-benchmark = "local_code_hermes.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_code_hermes"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/.pytest-tmp*", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
