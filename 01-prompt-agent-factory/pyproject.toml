[project]
name = "bl-loops-prompt-agent-factory"
version = "0.1.0"
description = "Fábrica didáctica y local de contratos para prompts, agentes y skills."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
factory-demo = "prompt_agent_factory.demo:main"
factory-export-schemas = "prompt_agent_factory.schema_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/prompt_agent_factory"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.local/pytest"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
